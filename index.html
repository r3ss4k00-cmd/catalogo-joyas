
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyería Kalo · Catálogo</title>
  <meta name="description" content="Catálogo de Joyería Kalo: anillos, cadenas, aritos, pulseras y dijes de plata, oro y perlas. Consultá por WhatsApp.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Joyería Kalo">
  <meta property="og:title" content="Joyería Kalo · Catálogo">
  <meta property="og:description" content="Catálogo de Joyería Kalo: anillos, cadenas, aritos, pulseras y dijes de plata, oro y perlas. Consultá por WhatsApp.">
  <meta property="og:image" content="https://i.ibb.co/xK0nmdNm/211f1113-66e7-4bf8-bd37-477c349102b4.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --crema: #fdf8f2;
      --crema-suave: #fffbf6;
      --beige: #ecdfcc;
      --terracota: #c17a5f;
      --terracota-oscuro: #a8593f;
      --dorado: #b08d4f;
      --dorado-suave: #d9c19a;
      --marron-texto: #4a3728;
      --marron-suave: #8a7362;
    }

    body {
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      background-color: var(--crema);
      background-image: linear-gradient(rgba(253, 248, 242, 0.7), rgba(250, 240, 224, 0.9)), url('fondo.avif');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      color: var(--marron-suave);
    }

    .barra-superior {
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: rgba(255, 251, 246, 0.88);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--dorado-suave);
      padding: 14px 24px;
    }

    .contenido {
      padding: 56px 20px 70px;
    }

    header {
      text-align: center;
      margin-bottom: 56px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 2.6em;
      letter-spacing: 0.5px;
      color: var(--marron-texto);
      margin: 0 0 10px 0;
    }

    .subtitulo {
      font-size: 0.75em;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--dorado);
      margin: 0 0 18px 0;
    }

    .subtitulo::after {
      content: "";
      display: block;
      width: 46px;
      height: 1px;
      background-color: var(--dorado-suave);
      margin: 16px auto 0 auto;
    }

    .catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 36px;
      max-width: 1040px;
      margin: 0 auto;
    }

    .tarjeta {
      background-color: var(--crema-suave);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(122, 90, 60, 0.1);
      text-align: center;
      cursor: pointer;
      border: none;
      padding: 0;
      width: 100%;
      font: inherit;
      color: inherit;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .tarjeta:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 30px rgba(122, 90, 60, 0.18);
    }

    .tarjeta img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .tarjeta:hover img {
      transform: scale(1.06);
    }

    .info {
      display: block;
      padding: 18px 16px 20px;
    }

    .nombre {
      display: block;
      font-family: 'Playfair Display', serif;
      font-size: 1.1em;
      font-weight: 600;
      margin: 0 0 12px 0;
      color: var(--marron-texto);
    }

    .estado {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 15px;
      font-size: 0.68em;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .disponible {
      background-color: #e8efe1;
      color: #55703f;
    }

    .vendida {
      background-color: #f4e2df;
      color: #9a4f42;
    }

    .reservada {
      background-color: #f7ecd6;
      color: #91711f;
    }

    .categorias {
      max-width: 1040px;
      margin: 0 auto 40px auto;
      text-align: center;
    }

    .fila-categorias {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .boton-categoria {
      font-family: 'Poppins', sans-serif;
      font-size: 0.85em;
      padding: 9px 20px;
      border: 1px solid var(--dorado-suave);
      border-radius: 20px;
      background-color: var(--crema-suave);
      color: var(--marron-texto);
      cursor: pointer;
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
    }

    .boton-categoria:hover {
      background-color: #f3e7d4;
      border-color: var(--dorado);
      transform: translateY(-1px);
    }

    .boton-categoria.activo {
      background-image: linear-gradient(135deg, var(--terracota), var(--dorado));
      border-color: transparent;
      color: white;
    }

    .boton-volver {
      font-family: 'Poppins', sans-serif;
      font-size: 0.8em;
      background: none;
      border: none;
      color: var(--dorado);
      text-decoration: underline;
      cursor: pointer;
    }

    .filtro {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      max-width: 1040px;
      margin: 0 auto;
      font-size: 0.85em;
      color: var(--marron-suave);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ddd;
      border-radius: 22px;
      transition: background-color 0.2s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: transform 0.2s ease;
    }

    .switch input:checked + .slider {
      background-color: var(--terracota);
    }

    .switch input:checked + .slider::before {
      transform: translateX(18px);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(35, 26, 18, 0.72);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.activo {
      display: flex;
    }

    .modal-contenido {
      position: relative;
      background-color: var(--crema-suave);
      border-radius: 18px;
      padding: 26px;
      width: 380px;
      max-width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      text-align: center;
      box-shadow: 0 20px 45px rgba(35, 26, 18, 0.3);
      transform: scale(0.94);
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .modal.activo .modal-contenido {
      transform: scale(1);
      opacity: 1;
    }

    .modal-contenido img {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 10px;
      margin: 0 auto 18px auto;
      display: block;
    }

    .modal-nombre {
      font-family: 'Playfair Display', serif;
      font-size: 1.3em;
      font-weight: 600;
      color: var(--marron-texto);
      margin: 0 0 6px 0;
    }

    .cerrar {
      position: absolute;
      top: 8px;
      right: 12px;
      background: none;
      border: none;
      font-size: 1.8em;
      line-height: 1;
      color: var(--marron-suave);
      cursor: pointer;
    }

    .cerrar:hover {
      color: var(--terracota-oscuro);
    }

    .boton-whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 4px auto 0 auto;
      padding: 10px 22px;
      background-color: var(--terracota-oscuro);
      color: white;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85em;
      font-weight: 500;
      border-radius: 24px;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(168, 89, 63, 0.3);
      transition: background-color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
    }

    .boton-whatsapp:hover {
      background-color: #8f4a34;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(168, 89, 63, 0.35);
    }
  </style>
</head>
<body>

  <div class="barra-superior">
    <div class="filtro">
      <span>Solo disponibles</span>
      <label class="switch">
        <input type="checkbox" id="filtroDisponibles">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="contenido">
    <header>
      <h1>Joyería Kalo</h1>
      <p class="subtitulo">Catálogo</p>
    </header>

    <div class="categorias">
      <div class="fila-categorias" id="botonesTipo"></div>
      <div class="fila-categorias" id="botonesMaterial" style="display: none;"></div>
      <button class="boton-volver" id="botonVolver" style="display: none;">Ver todas las categorías</button>
    </div>

    <div class="catalogo" id="catalogo"></div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-contenido">
      <button class="cerrar" id="cerrarModal">&times;</button>
      <img id="modalImagen" src="" alt="">
      <p class="modal-nombre" id="modalNombre"></p>
      <a href="#" target="_blank" rel="noopener" class="boton-whatsapp" id="enlaceWhatsapp">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.588-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.336-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"/>
        </svg>
        Consultar por WhatsApp
      </a>
    </div>
  </div>

  <script>
    const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQAC_qdJr0VEEpHaUNwoEZ6uTwQN4eVL9ybpvr05M0qbkXiW--lqFXc2Kv2fut0ZfEiG9zab2y82Zt-/pub?output=csv";

    // TODO: reemplazar por el número real de WhatsApp (formato 549 + característica + número, sin + ni espacios)
    const WHATSAPP_NUMERO = "5490000000000";

    let joyas = [];

    const etiquetas = {
      disponible: "Disponible",
      vendida: "Vendida",
      reservada: "Reservada"
    };

    const etiquetasTipo = {
      anillo: "Anillos",
      cadena: "Cadenas",
      arito: "Aritos",
      pulsera: "Pulseras",
      dije: "Dijes"
    };

    const IMAGEN_SIN_FOTO = "data:image/svg+xml;utf8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">' +
      '<rect width="100%" height="100%" fill="#ecdfcc"/>' +
      '<text x="50%" y="50%" font-family="Poppins, sans-serif" font-size="24" fill="#8a7362" text-anchor="middle" dominant-baseline="middle">Sin imagen</text>' +
      '</svg>'
    );

    function normalizarUrlImagen(url) {
      let limpia = url.trim();

      if (limpia.startsWith("http://")) {
        limpia = "https://" + limpia.slice("http://".length);
      }

      return limpia;
    }

    function manejarErrorImagen(img) {
      if (img.src !== IMAGEN_SIN_FOTO) {
        img.src = IMAGEN_SIN_FOTO;
      }
    }

    const contenedor = document.getElementById("catalogo");
    const checkbox = document.getElementById("filtroDisponibles");

    const contenedorTipos = document.getElementById("botonesTipo");
    const contenedorMateriales = document.getElementById("botonesMaterial");
    const botonVolver = document.getElementById("botonVolver");

    let tipoSeleccionado = null;
    let materialSeleccionado = null;

    const modal = document.getElementById("modal");
    const modalImagen = document.getElementById("modalImagen");
    const modalNombre = document.getElementById("modalNombre");
    const botonCerrar = document.getElementById("cerrarModal");
    const enlaceWhatsapp = document.getElementById("enlaceWhatsapp");

    modalImagen.onerror = function () {
      manejarErrorImagen(modalImagen);
    };

    function abrirModal(joya) {
      modalImagen.src = normalizarUrlImagen(joya.imagen);
      modalImagen.alt = joya.nombre;
      modalNombre.textContent = joya.nombre;

      const mensaje = `¡Hola! Me interesa esta joya: ${joya.nombre}, ¿me pasás más info?`;
      enlaceWhatsapp.href = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(mensaje)}`;

      modal.classList.add("activo");
    }

    function cerrarModal() {
      modal.classList.remove("activo");
    }

    botonCerrar.addEventListener("click", cerrarModal);

    modal.addEventListener("click", function (event) {
      if (event.target === modal) {
        cerrarModal();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        cerrarModal();
      }
    });

    function renderJoyas(lista) {
      contenedor.innerHTML = "";

      lista.forEach(function (joya) {
        const tarjeta = document.createElement("button");
        tarjeta.type = "button";
        tarjeta.className = "tarjeta";

        const imagen = document.createElement("img");
        imagen.src = normalizarUrlImagen(joya.imagen);
        imagen.alt = joya.nombre;
        imagen.loading = "lazy";
        imagen.onerror = function () {
          manejarErrorImagen(imagen);
        };

        const info = document.createElement("span");
        info.className = "info";

        const nombre = document.createElement("span");
        nombre.className = "nombre";
        nombre.textContent = joya.nombre;

        const estado = document.createElement("span");
        estado.className = "estado " + joya.estado;
        estado.textContent = etiquetas[joya.estado];

        info.appendChild(nombre);
        info.appendChild(estado);
        tarjeta.appendChild(imagen);
        tarjeta.appendChild(info);

        tarjeta.addEventListener("click", function () {
          abrirModal(joya);
        });

        contenedor.appendChild(tarjeta);
      });
    }

    function obtenerValoresUnicos(lista, propiedad) {
      const valores = [];

      lista.forEach(function (joya) {
        if (!valores.includes(joya[propiedad])) {
          valores.push(joya[propiedad]);
        }
      });

      return valores;
    }

    function capitalizar(texto) {
      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function dividirLineaCSV(linea) {
      const valores = [];
      let actual = "";
      let dentroDeComillas = false;

      for (let i = 0; i < linea.length; i++) {
        const caracter = linea[i];

        if (caracter === '"') {
          dentroDeComillas = !dentroDeComillas;
        } else if (caracter === "," && !dentroDeComillas) {
          valores.push(actual.trim());
          actual = "";
        } else {
          actual += caracter;
        }
      }

      valores.push(actual.trim());
      return valores;
    }

    function csvAJoyas(textoCSV) {
      const lineas = textoCSV.trim().split(/\r?\n/);
      const encabezados = dividirLineaCSV(lineas[0]);
      const resultado = [];

      for (let i = 1; i < lineas.length; i++) {
        if (!lineas[i].trim()) continue;

        const valores = dividirLineaCSV(lineas[i]);
        const joya = {};

        encabezados.forEach(function (encabezado, indice) {
          joya[encabezado] = valores[indice];
        });

        if (joya.nombre && joya.imagen) {
          resultado.push(joya);
        }
      }

      return resultado;
    }

    let tipos = [];
    let materiales = [];

    function actualizarCatalogo() {
      let lista = joyas;

      if (tipoSeleccionado) {
        lista = lista.filter(function (joya) {
          return joya.tipo === tipoSeleccionado;
        });
      }

      if (materialSeleccionado) {
        lista = lista.filter(function (joya) {
          return joya.material === materialSeleccionado;
        });
      }

      if (checkbox.checked) {
        lista = lista.filter(function (joya) {
          return joya.estado === "disponible";
        });
      }

      renderJoyas(lista);
    }

    function actualizarBotonVolver() {
      if (tipoSeleccionado || materialSeleccionado) {
        botonVolver.style.display = "inline-block";
      } else {
        botonVolver.style.display = "none";
      }
    }

    function renderBotonesTipo() {
      contenedorTipos.innerHTML = "";

      tipos.forEach(function (tipo) {
        const boton = document.createElement("button");
        boton.className = "boton-categoria";
        boton.textContent = etiquetasTipo[tipo];

        if (tipo === tipoSeleccionado) {
          boton.classList.add("activo");
        }

        boton.addEventListener("click", function () {
          tipoSeleccionado = tipo;
          materialSeleccionado = null;
          contenedorMateriales.style.display = "flex";
          renderBotonesTipo();
          renderBotonesMaterial();
          actualizarBotonVolver();
          actualizarCatalogo();
        });

        contenedorTipos.appendChild(boton);
      });
    }

    function renderBotonesMaterial() {
      contenedorMateriales.innerHTML = "";

      materiales.forEach(function (material) {
        const boton = document.createElement("button");
        boton.className = "boton-categoria";
        boton.textContent = capitalizar(material);

        if (material === materialSeleccionado) {
          boton.classList.add("activo");
        }

        boton.addEventListener("click", function () {
          materialSeleccionado = material;
          renderBotonesMaterial();
          actualizarBotonVolver();
          actualizarCatalogo();
        });

        contenedorMateriales.appendChild(boton);
      });
    }

    botonVolver.addEventListener("click", function () {
      tipoSeleccionado = null;
      materialSeleccionado = null;
      contenedorMateriales.style.display = "none";
      renderBotonesTipo();
      renderBotonesMaterial();
      actualizarBotonVolver();
      actualizarCatalogo();
    });

    checkbox.addEventListener("change", actualizarCatalogo);

    contenedor.innerHTML = "<p>Cargando joyas...</p>";

    fetch(URL_CSV)
      .then(function (respuesta) {
        if (!respuesta.ok) {
          throw new Error("Respuesta no exitosa: " + respuesta.status);
        }
        return respuesta.text();
      })
      .then(function (textoCSV) {
        joyas = csvAJoyas(textoCSV);
        tipos = obtenerValoresUnicos(joyas, "tipo");
        materiales = obtenerValoresUnicos(joyas, "material");

        renderBotonesTipo();
        renderBotonesMaterial();
        actualizarCatalogo();
      })
      .catch(function (error) {
        console.error("Error al cargar las joyas:", error);
        contenedor.innerHTML = "<p>No se pudieron cargar las joyas. Probá recargar la página.</p>";
      });
  </script>

</body>
</html>
